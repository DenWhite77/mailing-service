<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'mailing:home' %}">Mailing Service</a>
        <div class="navbar-nav">
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'mailing:client_list' %}">Получатели</a>
                <a class="nav-link" href="{% url 'mailing:message_list' %}">Сообщения</a>
                <a class="nav-link" href="{% url 'mailing:mailing_list' %}">Рассылки</a>
                <a class="nav-link" href="{% url 'mailing:attempt_list' %}">Попытки</a>
                <span class="navbar-text ms-3">{{ user.email }}</span>
                <form method="post" action="{% url 'users:logout' %}" class="d-inline ms-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
