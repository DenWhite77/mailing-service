{% extends 'base.html' %}

{% block title %}Удалить получателя{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto text-center">
        <h1>Удалить получателя?</h1>
        <p>Вы уверены, что хотите удалить <strong>{{ object.full_name }} ({{ object.email }})</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'mailing:client_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
